<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="certGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Certificate Canvas -->
  <rect width="600" height="420" rx="16" fill="url(#certBg)" />
  
  <!-- Outer & Inner Elegant Border -->
  <rect x="15" y="15" width="570" height="390" rx="12" fill="none" stroke="url(#cyanBorder)" stroke-width="2" opacity="0.8" />
  <rect x="25" y="25" width="550" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Corner Tech Accents -->
  <path d="M 15 45 L 45 15 M 15 375 L 45 405 M 585 45 L 555 15 M 585 375 L 555 405" stroke="#00f2fe" stroke-width="2" />

  <!-- Certificate Icon & Title -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">
    <!-- Mini emblem -->
    <circle cx="300" cy="80" r="30" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="3" filter="url(#certGlow)" />
    <path d="M 300 64 L 305 76 L 318 77 L 308 86 L 311 98 L 300 92 L 289 98 L 292 86 L 282 77 L 295 76 Z" fill="url(#goldGrad)" />

    <!-- Subtitle / Issuer -->
    <text x="300" y="140" font-size="12" font-weight="700" letter-spacing="3" fill="#38bdf8">CERTIFICATE OF ACHIEVEMENT</text>
    
    <!-- Main Headline -->
    <text x="300" y="180" font-size="22" font-weight="800" fill="#f8fafc">COURSE &amp; SKILL COMPLETION</text>
    
    <!-- Recipient -->
    <text x="300" y="215" font-size="13" fill="#94a3b8">This is proudly presented to</text>
    <text x="300" y="250" font-size="24" font-weight="bold" fill="url(#goldGrad)">Arvind Kumar</text>

    <!-- Details -->
    <text x="300" y="285" font-size="13" fill="#cbd5e1">In recognition of demonstrated proficiency &amp; practical project execution</text>
    
    <!-- Bottom line dividers -->
    <line x1="80" y1="330" x2="240" y2="330" stroke="#475569" stroke-width="1.5" />
    <text x="160" y="352" font-size="11" fill="#94a3b8">Verified Credential</text>
    
    <line x1="360" y1="330" x2="520" y2="330" stroke="#475569" stroke-width="1.5" />
    <text x="440" y="352" font-size="11" fill="#94a3b8">Authorized Instructor</text>

    <!-- Security Stamp / Badge -->
    <circle cx="300" cy="335" r="22" fill="#0b0f19" stroke="#10b981" stroke-width="2" />
    <text x="300" y="340" font-size="14" fill="#34d399">✔</text>
    <text x="300" y="380" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">ID: AK-DEV-2026-CERT</text>
  </g>
</svg>
