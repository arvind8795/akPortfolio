<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.9" />
    </linearGradient>
    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#p3Bg)" />

  <!-- Ambient Glow -->
  <circle cx="150" cy="120" r="100" fill="#a855f7" opacity="0.15" filter="url(#p3Glow)" />
  <circle cx="450" cy="260" r="110" fill="#ec4899" opacity="0.12" filter="url(#p3Glow)" />

  <!-- Dashboard App Mockup -->
  <g transform="translate(45, 35)">
    <!-- Main App Container -->
    <rect width="510" height="310" rx="14" fill="#121215" stroke="#3f3f46" stroke-width="1.5" />

    <!-- App Header -->
    <rect width="510" height="42" rx="14" fill="#1c1917" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="255" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">TaskFlow — Responsive Web Application</text>

    <!-- Sidebar Mockup -->
    <rect x="0" y="42" width="120" height="268" fill="#18181b" />
    <rect x="14" y="60" width="92" height="24" rx="6" fill="#27272a" />
    <text x="32" y="76" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f43f5e">⚡ Dashboard</text>
    <rect x="14" y="94" width="92" height="20" rx="6" fill="transparent" />
    <text x="32" y="108" font-family="'Inter', sans-serif" font-size="10" fill="#71717a">📂 Projects</text>
    <text x="32" y="136" font-family="'Inter', sans-serif" font-size="10" fill="#71717a">📊 Analytics</text>
    <text x="32" y="164" font-family="'Inter', sans-serif" font-size="10" fill="#71717a">⚙ Settings</text>

    <!-- Main Content Area -->
    <!-- Stat 1 -->
    <rect x="135" y="55" width="115" height="60" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1" />
    <text x="148" y="75" font-family="'Inter', sans-serif" font-size="10" fill="#a1a1aa">Tasks Done</text>
    <text x="148" y="100" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#34d399">98.4%</text>

    <!-- Stat 2 -->
    <rect x="260" y="55" width="115" height="60" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1" />
    <text x="273" y="75" font-family="'Inter', sans-serif" font-size="10" fill="#a1a1aa">Weekly Goals</text>
    <text x="273" y="100" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#a855f7">12 / 12</text>

    <!-- Stat 3 -->
    <rect x="385" y="55" width="115" height="60" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1" />
    <text x="398" y="75" font-family="'Inter', sans-serif" font-size="10" fill="#a1a1aa">Performance</text>
    <text x="398" y="100" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">100 ms</text>

    <!-- Task List Cards -->
    <g transform="translate(135, 130)">
      <!-- Item 1 -->
      <rect width="365" height="46" rx="8" fill="#18181b" stroke="#27272a" />
      <circle cx="22" cy="23" r="8" fill="#10b981" />
      <path d="M 18 23 L 21 26 L 27 19" fill="none" stroke="#ffffff" stroke-width="2" />
      <text x="40" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f4f4f5">Complete HTML5 &amp; CSS3 Layout</text>
      <text x="40" y="36" font-family="'Inter', sans-serif" font-size="10" fill="#71717a">High Priority • Frontend Dev</text>
      <rect x="290" y="13" width="60" height="20" rx="10" fill="#065f46" />
      <text x="320" y="27" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" text-anchor="middle">DONE</text>

      <!-- Item 2 -->
      <g transform="translate(0, 56)">
        <rect width="365" height="46" rx="8" fill="#18181b" stroke="#27272a" />
        <circle cx="22" cy="23" r="8" fill="#3b82f6" />
        <path d="M 18 23 L 21 26 L 27 19" fill="none" stroke="#ffffff" stroke-width="2" />
        <text x="40" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f4f4f5">Build Dark/Light Mode Switcher</text>
        <text x="40" y="36" font-family="'Inter', sans-serif" font-size="10" fill="#71717a">JavaScript • LocalStorage API</text>
        <rect x="290" y="13" width="60" height="20" rx="10" fill="#1e3a8a" />
        <text x="320" y="27" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#93c5fd" text-anchor="middle">ACTIVE</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 112)">
        <rect width="365" height="46" rx="8" fill="#18181b" stroke="#27272a" />
        <circle cx="22" cy="23" r="8" fill="#f59e0b" />
        <text x="40" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f4f4f5">Deploy on Web &amp; Test Mobile Responsiveness</text>
        <text x="40" y="36" font-family="'Inter', sans-serif" font-size="10" fill="#71717a">Fast Loading • Accessible</text>
        <rect x="290" y="13" width="60" height="20" rx="10" fill="#78350f" />
        <text x="320" y="27" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#fde68a" text-anchor="middle">VERIFIED</text>
      </g>
    </g>
  </g>
</svg>
