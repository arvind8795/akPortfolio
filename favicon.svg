<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#0b0f19" />
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="url(#favGrad)" stroke-width="3" opacity="0.8" />
  <!-- Monogram AK -->
  <text x="50" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="url(#favGrad)" text-anchor="middle" filter="url(#favGlow)" letter-spacing="-2">AK</text>
  <circle cx="80" cy="24" r="5" fill="#00f2fe" />
</svg>
