<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="p2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#p2Bg)" />

  <!-- Binary Background Accents -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#334155" opacity="0.3">
    <text x="30" y="30">01000011 00101011 00101011 00100000 01010011 01011001 01010011</text>
    <text x="30" y="360">01010011 01010100 01010101 01000100 01000101 01001110 01010100</text>
  </g>

  <!-- Ambient Glow -->
  <circle cx="500" cy="90" r="100" fill="#10b981" opacity="0.12" filter="url(#p2Glow)" />
  <circle cx="80" cy="290" r="100" fill="#0284c7" opacity="0.15" filter="url(#p2Glow)" />

  <!-- Terminal Window Mockup -->
  <g transform="translate(50, 40)">
    <rect width="500" height="300" rx="12" fill="#030712" stroke="#1f2937" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 488 0 Q 500 0 500 12 L 500 36 L 0 36 Z" fill="#111827" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="250" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9ca3af" text-anchor="middle">terminal — ./student_system_cpp</text>

    <!-- Terminal Content -->
    <g font-family="'JetBrains Mono', monospace" font-size="12">
      <!-- Welcome header -->
      <text x="25" y="65" fill="#10b981" font-weight="bold">=== STUDENT RECORD MANAGEMENT SYSTEM (C++) ===</text>
      <text x="25" y="88" fill="#64748b">[INFO] Initializing dynamic memory &amp; file pointers...</text>
      <text x="25" y="108" fill="#60a5fa">&gt; Loading Records from database.dat [OK]</text>

      <!-- Menu options -->
      <text x="25" y="138" fill="#f1f5f9">1. Add New Student Record</text>
      <text x="25" y="158" fill="#f1f5f9">2. Search Student by Roll / ID</text>
      <text x="25" y="178" fill="#f1f5f9">3. Calculate Grade, GPA &amp; Academic Stats</text>
      <text x="25" y="198" fill="#f1f5f9">4. Sort Records via MergeSort Algorithm</text>

      <!-- Executed command -->
      <text x="25" y="235" fill="#eab308">&gt; Enter Choice [1-4]: 3</text>
      
      <!-- Stats Result Card inside terminal -->
      <rect x="25" y="248" width="450" height="38" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="40" y="272" fill="#34d399" font-weight="bold">✔ Top Scorer: Arvind Kumar (BCA 2nd Yr) | GPA: 9.4 / 10.0</text>
    </g>
  </g>
</svg>
