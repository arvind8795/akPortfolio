<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd1aa" />
      <stop offset="100%" stop-color="#e5a87d" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Ambience -->
  <rect width="500" height="500" rx="30" fill="#0c101c" />
  <circle cx="250" cy="230" r="210" fill="url(#bgGlow)" />

  <!-- High-tech Circle Rings -->
  <circle cx="250" cy="230" r="195" fill="none" stroke="url(#neonCyanPurple)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="250" cy="230" r="180" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" />

  <!-- Code Floating Tags / Cyber Badges -->
  <g opacity="0.85">
    <rect x="50" y="80" width="80" height="28" rx="14" fill="#1e293b" stroke="#00f2fe" stroke-width="1" />
    <text x="90" y="98" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="middle">&lt;/&gt; DEV</text>

    <rect x="370" y="110" width="80" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="410" y="128" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle">C / C++</text>

    <rect x="45" y="360" width="90" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="90" y="378" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#60a5fa" text-anchor="middle">BCA 2nd Yr</text>

    <rect x="370" y="340" width="85" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="412" y="358" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">JS / Web</text>
  </g>

  <!-- Developer Silhouette / Illustration -->
  <!-- Hoodie / Shoulders -->
  <path d="M 120 480 C 120 370, 160 340, 250 340 C 340 340, 380 370, 380 480 Z" fill="url(#hoodieGrad)" filter="url(#dropShadow)" />
  <!-- Hoodie Collar / Accent Lines -->
  <path d="M 210 340 L 250 400 L 290 340" fill="none" stroke="url(#neonCyanPurple)" stroke-width="3" />
  <path d="M 250 400 L 250 480" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Neck -->
  <rect x="228" y="270" width="44" height="60" rx="10" fill="#e5a87d" />

  <!-- Head Base -->
  <ellipse cx="250" cy="220" rx="68" ry="78" fill="url(#faceGrad)" filter="url(#dropShadow)" />

  <!-- Ears -->
  <ellipse cx="180" cy="220" rx="12" ry="18" fill="#e5a87d" />
  <ellipse cx="320" cy="220" rx="12" ry="18" fill="#e5a87d" />

  <!-- Hair Style (Modern undercut / side swoop) -->
  <path d="M 180 200 C 175 145, 210 120, 250 120 C 300 120, 325 145, 320 200 C 310 155, 280 140, 240 140 C 200 140, 185 170, 180 200 Z" fill="url(#hairGrad)" />
  <path d="M 182 170 C 190 130, 240 125, 275 130 C 310 135, 320 155, 322 180 C 310 160, 280 150, 250 150 C 210 150, 195 160, 182 170 Z" fill="#2e1065" opacity="0.4" />

  <!-- Smart Glasses -->
  <g filter="url(#softGlow)">
    <rect x="195" y="200" width="45" height="30" rx="8" fill="none" stroke="#00f2fe" stroke-width="3.5" />
    <rect x="260" y="200" width="45" height="30" rx="8" fill="none" stroke="#00f2fe" stroke-width="3.5" />
    <line x1="240" y1="213" x2="260" y2="213" stroke="#00f2fe" stroke-width="3" />
    <line x1="182" y1="212" x2="195" y2="212" stroke="#00f2fe" stroke-width="2.5" />
    <line x1="305" y1="212" x2="318" y2="212" stroke="#00f2fe" stroke-width="2.5" />
    <!-- Glass Lens Reflections -->
    <path d="M 200 205 L 215 205 L 205 225 L 198 225 Z" fill="#ffffff" opacity="0.35" />
    <path d="M 265 205 L 280 205 L 270 225 L 263 225 Z" fill="#ffffff" opacity="0.35" />
  </g>

  <!-- Eyes behind glasses -->
  <circle cx="218" cy="215" r="4" fill="#1e1b4b" />
  <circle cx="282" cy="215" r="4" fill="#1e1b4b" />

  <!-- Eyebrows -->
  <path d="M 196 193 Q 218 188 238 193" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 262 193 Q 282 188 304 193" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 250 220 L 246 238 L 254 238" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Friendly Confident Smile -->
  <path d="M 235 255 Q 250 268 265 255" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" />

  <!-- Modern Headphones on neck -->
  <path d="M 170 240 C 170 305, 330 305, 330 240" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <rect x="160" y="235" width="22" height="40" rx="10" fill="#3b82f6" filter="url(#softGlow)" />
  <rect x="318" y="235" width="22" height="40" rx="10" fill="#8b5cf6" filter="url(#softGlow)" />

  <!-- Laptop in front -->
  <g transform="translate(140, 420)">
    <polygon points="0,60 220,60 200,10 20,10" fill="url(#laptopGrad)" stroke="#475569" stroke-width="1.5" />
    <polygon points="10,55 210,55 192,15 28,15" fill="#0b0f19" />
    <path d="M 95 32 L 105 24 L 115 32 L 125 24" fill="none" stroke="#00f2fe" stroke-width="2" />
    <rect x="-10" y="60" width="240" height="12" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Glowing light bar -->
    <rect x="80" y="62" width="60" height="3" rx="1.5" fill="#00f2fe" filter="url(#softGlow)" />
  </g>
</svg>
