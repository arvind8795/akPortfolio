<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#p1Bg)" />

  <!-- Futuristic Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Ambient Glow Orb -->
  <circle cx="120" cy="100" r="90" fill="#00f2fe" opacity="0.15" filter="url(#pGlow)" />
  <circle cx="480" cy="280" r="100" fill="#8b5cf6" opacity="0.15" filter="url(#pGlow)" />

  <!-- Code Editor Mockup Window -->
  <g transform="translate(60, 45)">
    <!-- Window Frame -->
    <rect width="480" height="290" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <!-- Title Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 468 0 Q 480 0 480 12 L 480 36 L 0 36 Z" fill="#1f2937" />
    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="240" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9ca3af" text-anchor="middle">portfolio.html — Arvind Kumar</text>

    <!-- Code Line Preview -->
    <g font-family="'JetBrains Mono', monospace" font-size="13">
      <!-- Line 1 -->
      <text x="30" y="70" fill="#f43f5e">&lt;!DOCTYPE</text>
      <text x="110" y="70" fill="#e2e8f0">html&gt;</text>

      <!-- Line 2 -->
      <text x="30" y="98" fill="#3b82f6">&lt;section</text>
      <text x="105" y="98" fill="#38bdf8">class=</text>
      <text x="155" y="98" fill="#a7f3d0">"hero-container"</text>
      <text x="295" y="98" fill="#3b82f6">&gt;</text>

      <!-- Line 3 -->
      <text x="50" y="126" fill="#ec4899">&lt;h1&gt;</text>
      <text x="85" y="126" fill="#f8fafc" font-weight="bold">Arvind Kumar</text>
      <text x="200" y="126" fill="#ec4899">&lt;/h1&gt;</text>

      <!-- Line 4 -->
      <text x="50" y="154" fill="#a855f7">&lt;p</text>
      <text x="75" y="154" fill="#38bdf8">class=</text>
      <text x="125" y="154" fill="#a7f3d0">"badge"</text>
      <text x="185" y="154" fill="#a855f7">&gt;</text>
      <text x="195" y="154" fill="#00f2fe">BCA 2nd Year Student</text>
      <text x="375" y="154" fill="#a855f7">&lt;/p&gt;</text>

      <!-- Line 5 -->
      <text x="50" y="182" fill="#10b981">// Tech Stack: HTML5 • CSS3 • JS</text>

      <!-- Line 6 -->
      <text x="50" y="210" fill="#eab308">const</text>
      <text x="100" y="210" fill="#f8fafc">developer</text>
      <text x="185" y="210" fill="#f43f5e">=</text>
      <text x="205" y="210" fill="#e2e8f0">{ status:</text>
      <text x="280" y="210" fill="#34d399">"Open to Internships"</text>
      <text x="445" y="210" fill="#e2e8f0">};</text>

      <!-- Line 7 -->
      <text x="30" y="240" fill="#3b82f6">&lt;/section&gt;</text>
    </g>

    <!-- Mini UI Floating Badge -->
    <g transform="translate(280, 160)">
      <rect width="180" height="100" rx="10" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" filter="url(#pGlow)" />
      <circle cx="30" cy="30" r="14" fill="#00f2fe" opacity="0.2" />
      <text x="30" y="35" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" text-anchor="middle">⚡</text>
      <text x="55" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Live Preview</text>
      <text x="55" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Interactive UI &amp; UX</text>
      <rect x="20" y="62" width="140" height="24" rx="6" fill="url(#cyanGrad)" />
      <text x="90" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#0b0f19" text-anchor="middle">Explore Website →</text>
    </g>
  </g>
</svg>
